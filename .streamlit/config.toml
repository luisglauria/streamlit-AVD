# Identidade visual: paleta do notebook da EDA (roxo escuro + rosa claro)
[theme]
base = "light"
primaryColor = "#2d223a"            # cor de destaque (slider, tags, botões)
backgroundColor = "#ffffff"         # fundo da página
secondaryBackgroundColor = "#f6ecea" # fundo da sidebar e dos widgets
textColor = "#2d223a"               # cor do texto
font = "sans serif"
